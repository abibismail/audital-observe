name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_github:
        description: 'Run the opt-in live GitHub read-only test (needs AUDITAL_LIVE_GITHUB_TOKEN secret, Issues:read only)'
        type: boolean
        default: false
permissions: {contents: read}
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint:syntax
      - run: npm test
      - run: npm run demo:phantom-success
  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      AUDITAL_PG_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:pg
  live-github:
    if: github.event_name == 'workflow_dispatch' && inputs.live_github
    runs-on: ubuntu-latest
    env:
      AUDITAL_LIVE_GITHUB_TOKEN: ${{ secrets.AUDITAL_LIVE_GITHUB_TOKEN }}
      AUDITAL_LIVE_GITHUB_ISSUE: ${{ vars.AUDITAL_LIVE_GITHUB_ISSUE || 'cli/cli#1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:live-github
